services:
  # The Bisawtak backend API (FastAPI). Historically named "whisper-api" back
  # when it ran a local Whisper model; transcription is now 100% remote ASR
  # providers, so the service is named for what it actually is.
  bisawtak-api:
    build: .
    container_name: bisawtak-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      # Support-ticket image attachments (and any future user-uploaded files).
      # MUST be a named volume — anything written to /app/uploads is wiped
      # on every container recreate without this.
      - bisawtak-uploads:/app/uploads
      # Server-side credential files (Firebase service-account, future Apple
      # Sign-In .p8 etc). Bind-mounted read-only from the host so we can
      # rotate keys without a rebuild. The host folder is gitignored — CI/CD
      # never touches it. The path INSIDE the container is what env vars
      # like FIREBASE_SERVICE_ACCOUNT_PATH point at.
      - ./secrets:/app/secrets:ro
    depends_on:
      bisawtak-db:
        condition: service_healthy
    networks:
      bisawtak-net: {}
      proxy-network:
        # Legacy DNS alias: nginx-proxy-manager (proxy host for voice.neojeen.com)
        # still forwards to "whisper-api". Keeping this alias lets the rename ship
        # with ZERO downtime and without restarting the shared reverse proxy.
        # To retire it: change the Forward Hostname to "bisawtak-api" in the NPM
        # UI, then delete this alias.
        aliases:
          - whisper-api

  bisawtak-admin:
    build: ../admin
    container_name: bisawtak-admin
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Blank = use same-origin /api/v1, which is what we want when served
      # through nginx-proxy-manager on voice.neojeen.com.
      - NEXT_PUBLIC_API_URL=/api/v1
    networks:
      - proxy-network

  bisawtak-db:
    image: postgres:16-alpine
    container_name: bisawtak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bisawtak
      POSTGRES_USER: bisawtak
      POSTGRES_PASSWORD: bisawtak_pass
    volumes:
      - bisawtak-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bisawtak"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bisawtak-net

volumes:
  bisawtak-uploads:
  bisawtak-pgdata:

networks:
  bisawtak-net:
    driver: bridge
  proxy-network:
    external: true

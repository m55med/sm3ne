name: bisawtak
description: "بصوتك - Speech to Text"
publish_to: 'none'
version: 1.0.0+40

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State Management
  flutter_riverpod: ^2.6.1
  # Routing
  go_router: ^14.8.1
  # HTTP
  dio: ^5.7.0
  # Local Storage
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  # Firebase — Analytics + crash reporting
  firebase_core: ^3.8.0
  firebase_analytics: ^11.3.6
  firebase_crashlytics: ^4.1.6
  firebase_messaging: ^15.1.6
  # Displays foreground FCM messages as actual system notifications.
  # firebase_messaging only auto-displays when the app is backgrounded; this
  # plugin closes the gap so users see notifications regardless of state.
  flutter_local_notifications: ^18.0.1
  # Reads device model, OS version, marketing name etc. for the device list
  # the admin sees on /devices.
  device_info_plus: ^11.2.0
  # Auth
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^6.1.4
  # Audio
  file_picker: ^9.2.1
  record: ^5.0.5
  # On-device speech recognition (iOS SFSpeechRecognizer + Android SpeechRecognizer).
  # Default transcription engine — skips server cost when the device can handle
  # it locally. Falls back to /transcribe on failure.
  speech_to_text: ^7.0.0
  # Share
  receive_sharing_intent: ^1.8.1
  share_plus: ^10.1.4
  # Ads
  # NOTE: google_mobile_ads currently uses AdMob test IDs (see AndroidManifest
  # and Info.plist). Mobile-3 may swap or remove this in a follow-up.
  google_mobile_ads: ^5.3.0
  # UI
  intl: ^0.20.2
  shimmer: ^3.0.0
  lottie: ^3.3.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  # Utils
  path_provider: ^2.1.5
  permission_handler: ^12.0.0+1
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.0.0
  # Used to hash the Apple Sign-In nonce on the device before sending to backend.
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# TEMPORARY WORKAROUND:
# record_linux's latest version has an API mismatch with the shared
# record_platform_interface 1.3+. Pin platform_interface to what 0.7.1
# actually implements. Remove this override once record_linux catches up.
dependency_overrides:
  record_platform_interface: 1.1.0


flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

# App launcher icons. Regenerate after changing assets/icon/* with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#4A90D9"
    theme_color: "#4A90D9"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"

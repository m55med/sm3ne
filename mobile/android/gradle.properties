# -Duser.language/country pin the Gradle JVM to a neutral locale. The build
# host runs with an Arabic (ar-EG) locale, which makes BundleTool format dex
# filenames with Arabic-Indic digits ('classes٢.dex') and then fail to match
# the real ASCII-named files ('classes2.dex'). Forcing en-US keeps tooling
# numerals ASCII.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=256m -Duser.language=en -Duser.country=US
# Sized for a 16 GB host: the Gradle daemon, the Kotlin compile daemon, and the
# bundletool worker each spawn their own JVM. The previous -Xmx8G + 4G metaspace
# made them collectively exceed physical RAM, so the box swapped hard (a 36-min
# build) and the daemon died with a Metaspace OOM. Keep each JVM modest and cap
# worker parallelism so the total footprint fits in RAM.
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G
android.useAndroidX=true
kotlin.jvm.target.validation.mode=IGNORE
# AGP 8.11+/9 enables the "new DSL" interface by default, which the bundled
# Flutter Gradle plugin (Flutter 3.41) doesn't support yet — it fails with a
# NullPointerException in the project-evaluation listener. Opt out until
# Flutter ships AGP-9-compatible Gradle tooling.
android.newDsl=false
